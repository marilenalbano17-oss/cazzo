<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buon Compleanno!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Sacramento&display=swap" rel="stylesheet">
  <!-- Libreria per i coriandoli -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
      color: #fff;
    }

    /* --- SCHERMATA 1 --- */
    .card-container {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      max-width: 350px;
      width: 90%;
      position: relative;
    }

    .title-curved {
      font-family: 'Sacramento', cursive;
      font-size: 2.8rem;
      color: #ff3366;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .photo-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 30px auto;
      border-radius: 50%;
      padding: 8px;
      background: linear-gradient(45deg, #ff6b6b, #feca57);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
    }

    /* Tasto sfuggente */
    .btn-runaway {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: #ff3366;
      border: none;
      border-radius: 50px;
      box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease-out;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- SCHERMATA 2 (Cuore) --- */
    .hidden {
      display: none !important;
    }

    .heart-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }

    .heart-container {
      position: relative;
      width: 360px;
      height: 360px;
    }

    /* Foto al centro del cuore */
    .center-photo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 8px 25px rgba(255, 51, 102, 0.3);
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards 1s; /* Compare dopo 1s */
    }

    .heart-text {
      position: absolute;
      font-size: 0.8rem;
      font-weight: 800;
      color: #ff3366;
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(255,255,255,0.8);
      animation: popIn 0.5s ease forwards;
      opacity: 0;
      z-index: 2;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

  <!-- Prima schermata -->
  <div class="card-container" id="screen1">
    <h1 class="title-curved">Buon compleanno amo</h1>
    
    <div class="photo-wrapper">
      <img src="foto.jpg" alt="Foto speciale">
    </div>

    <button class="btn-runaway" id="runBtn">Clicca qui!</button>
  </div>

  <!-- Seconda schermata -->
  <div class="heart-screen hidden" id="screen2">
    <div class="heart-container" id="heart">
      <!-- Foto posizionata perfettamente al centro del cuore -->
      <img src="foto.jpeg" alt="Foto speciale" class="center-photo">
    </div>
  </div>

  <!-- Audio di sottofondo -->
  <audio id="bgMusic" src="canzone.mp3" preload="auto"></audio>

  <script>
    const runBtn = document.getElementById('runBtn');
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');
    const heartContainer = document.getElementById('heart');
    const bgMusic = document.getElementById('bgMusic');

    let escapeCount = 0;
    const maxEscapes = 4;

    function moveButton() {
      if (escapeCount < maxEscapes) {
        const x = (Math.random() - 0.5) * 200;
        const y = (Math.random() - 0.5) * 200;
        runBtn.style.transform = `translate(${x}px, ${y}px)`;
        escapeCount++;
      } else {
        runBtn.style.transform = `translate(0px, 0px)`;
        runBtn.innerText = "Va bene, ti lascio cliccare! ❤️";
      }
    }

    runBtn.addEventListener('touchstart', (e) => {
      if (escapeCount < maxEscapes) {
        e.preventDefault();
        moveButton();
      }
    });

    runBtn.addEventListener('mouseover', () => {
      if (escapeCount < maxEscapes) {
        moveButton();
      }
    });

    runBtn.addEventListener('click', () => {
      screen1.classList.add('hidden');
      screen2.classList.remove('hidden');
      
      bgMusic.play().catch(() => console.log("Audio bloccato dal browser"));
      
      createHeart();
      launchConfetti();
    });

    function createHeart() {
      const totalWords = 36;
      const phrase = "Tanti Auguri";

      for (let i = 0; i < totalWords; i++) {
        const t = (i / totalWords) * (2 * Math.PI);
        
        // Equazione del cuore scalata leggermente per racchiudere la foto
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        const posX = 180 + x * 10;
        const posY = 170 + y * 10;

        const span = document.createElement('span');
        span.className = 'heart-text';
        span.innerText = phrase;
        span.style.left = `${posX}px`;
        span.style.top = `${posY}px`;
        
        span.style.animationDelay = `${i * 0.05}s`;

        heartContainer.appendChild(span);
      }
    }

    // Effetto coriandoli all'apertura
    function launchConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        const particleCount = 50 * (timeLeft / duration);
        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
      }, 250);
    }

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }
  </script>
</body>
</html>
